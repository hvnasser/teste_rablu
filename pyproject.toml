version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.44",
    "playwright-stealth>=1.0",
    "supabase>=2.4",
    "httpx>=0.27",
    "streamlit>=1.35",
    "plotly>=5.22",
    "pandas>=2.2",
